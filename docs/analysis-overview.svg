<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="360" viewBox="0 0 1140 360" role="img" aria-labelledby="title desc">
  <title id="title">SAE–Transcoder analysis overview</title>
  <desc id="desc">Prepared arrays with fixed selected features feed three parallel analyses. Activation analysis compares, restores, and decomposes activations. Encoder interventions rotate, remove, and rescale components. Sentence evaluation detects entities and retrieves sentences. Each branch leads downward to its results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1140" height="360" rx="12" fill="#ffffff"/>
  <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M570 88 V116 H190 V148"/>
    <path d="M570 88 V148"/>
    <path d="M570 88 V116 H950 V148"/>
    <path d="M190 228 V280"/>
    <path d="M570 228 V280"/>
    <path d="M950 228 V280"/>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.5">
    <rect x="390" y="12" width="360" height="76" rx="8" fill="#f1f5f9"/>
    <rect x="15" y="148" width="350" height="80" rx="8" fill="#eff6ff"/>
    <rect x="395" y="148" width="350" height="80" rx="8" fill="#f5f3ff"/>
    <rect x="775" y="148" width="350" height="80" rx="8" fill="#ecfdf5"/>
    <rect x="15" y="280" width="350" height="58" rx="8" fill="#f8fafc"/>
    <rect x="395" y="280" width="350" height="58" rx="8" fill="#f8fafc"/>
    <rect x="775" y="280" width="350" height="58" rx="8" fill="#f8fafc"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#0f172a">
    <g font-size="21" font-weight="600">
      <text x="570" y="43">Prepared arrays</text>
      <text x="190" y="180">Activation analysis</text>
      <text x="570" y="180">Encoder interventions</text>
      <text x="950" y="180">Sentence evaluation</text>
    </g>
    <g font-size="18" fill="#334155">
      <text x="570" y="69">Fixed selected features</text>
      <text x="190" y="209">Compare · Restore · Decompose</text>
      <text x="570" y="209">Rotate · Remove · Rescale</text>
      <text x="950" y="209">Detect · Retrieve</text>
      <text x="190" y="316">AUROC and loss terms</text>
      <text x="570" y="316">Intervention AUROCs</text>
      <text x="950" y="316">F1 and retrieval performance</text>
    </g>
  </g>
</svg>
